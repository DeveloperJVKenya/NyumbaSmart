name: cmms
description: A CMMS Flutter application.
publish_to: 'none'

version: 1.0.0+1

environment:
  # webview_flutter (BIM 3D viewer) requires Dart 3.10+, so the floor matches what the app already resolves to.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.0
  firebase_messaging: ^17.0.0
  cloud_functions: ^7.0.0
  
  # UI & Design
  responsive_builder: ^0.7.0
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.2
  
  # Utilities
  intl: ^0.20.3
  logger: ^2.5.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  async: ^2.13.0
  
  # HTTP & Networking
  http: ^1.3.0
  dio: ^5.8.0+1
  connectivity_plus: ^7.3.1
  url_launcher: ^6.2.4
  
  # File Handling
  file_picker: ^12.0.0-beta.7
  flutter_pdfview: ^1.3.2
  open_file: ^4.0.0
  image_picker: ^1.1.2
  excel: ^4.0.6
  
  # Notifications & Background Tasks
  flutter_local_notifications: ^22.3.0
  rxdart: ^0.28.0
  
  # Permissions & Device
  permission_handler: ^13.0.1
  vibration: ^3.1.3
  screen_brightness: ^2.1.5
  device_info_plus: ^13.2.0
  
  # Location & Maps
  geocoding: ^5.0.0
  google_maps_flutter: ^2.12.2
  geolocator: ^14.0.1
  
  # Audio
  audioplayers: ^6.5.0
  
  # Web
  web: ^1.1.1
  flutter_secure_storage: ^11.0.0
  font_awesome_flutter: ^11.0.0

  # BIM 3D viewer (Android/iOS/macOS; web uses an iframe)
  webview_flutter: ^4.14.1

flutter:
  assets:
    - assets/icons/icon.png
    - assets/icons/
    - assets/sounds/
    - assets/bim_viewer/
    - assets/
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
