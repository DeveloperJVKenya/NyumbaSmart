# JVM memory optimizations
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Enable AndroidX + Jetifier
android.useAndroidX=true
android.enableJetifier=true

# ✅ Flutter SDK version overrides (to avoid build.gradle.kts errors).
# minSdk 24 (Android 7.0) is the minimum for the Firebase Android SDK (BoM 35) used by FlutterFire 5.x.
flutter.minSdkVersion=24
flutter.targetSdkVersion=35
flutter.compileSdkVersion=35
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Slow mirrors: allow longer artifact downloads before Gradle gives up (defaults are 30s).
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
